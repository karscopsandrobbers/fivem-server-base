endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

sv_scriptHookAllowed 0

# What the server browser shows and searches on.
sv_hostname "FiveM Base"
sets sv_projectName "FiveM Base"
sets sv_projectDesc "A barebones TypeScript FiveM server."
sets tags "freeroam, base"
sets locale "en-GB"

# The game build the clients run. 3717 is the current gen8 build. Leave it unless a content pack
# needs another one. Never put a semicolon in a cfg comment: the parser splits on it first.
set sv_enforceGameBuild 3717
sv_pureLevel 1

# Only the server may write state bags. Every replicated value here goes through the server's
# entity proxies, so a client can never forge one. Do not put a semicolon in a cfg comment.
setr sv_stateBagStrictMode true

sv_maxclients 32

# sv_licenseKey lives in keys.cfg (gitignored) — copy keys.cfg.example.
exec keys.cfg
exec permissions.cfg

# Content packs first: the base resource creates its world objects as it starts, and a server-side
# CreateObject on a model nothing has registered yet is refused.
exec resources.dlc.cfg
exec resources.cfg
