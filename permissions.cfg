# Who may use the admin commands (/car, /ped, /dv, /tp, /debug ...).
#
# The base checks one ace: `base.admin`. Give it to a group and put your identifiers in the group.
# Find your licence identifier in the server console when you join (it is printed on playerJoining).
add_ace group.admin base.admin allow

